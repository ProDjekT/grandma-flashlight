name: Android CI

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          validate-wrappers: false

      - name: Set SDK location
        run: |
          echo "sdk.dir=$HOME/.android/sdk" >> local.properties

      - name: Run unit tests and build APK
        run: gradle test assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.HOME }}/.android/sdk
          ANDROID_SDK_ROOT: ${{ env.HOME }}/.android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
